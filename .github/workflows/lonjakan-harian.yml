# Kirim preset "Lonjakan yang masih bisa dibeli" dua kali sehari.
#
# Kanalnya dipilih sendiri oleh `idxscreen notify`: Telegram bila
# TELEGRAM_TOKEN terpasang, selain itu WhatsApp. Pasang salah satu set
# secret saja - tidak perlu keduanya.
#
# WIB = UTC+7 dan tidak pernah berganti tanggal pada jam-jam ini, jadi hari
# cron-nya sama persis dengan hari WIB: 1-5 = Senin-Jumat.
#
# Cron GitHub di repo ini terbukti telat 4,5-7 jam (September 2026: kiriman
# 08:30 tiba 13.07-13.34, kiriman 15:00 tiba 20.03-21.48). Supaya tepat
# waktu, picu lewat API workflow_dispatch dari penjadwal luar (cron-job.org
# atau cron VPS) - dispatch langsung jalan tanpa antre. Lihat README bagian
# "Kirim tepat waktu". Jadwal di bawah hanya cadangan; hapus setelah pemicu
# luar berjalan, agar pesan tidak terkirim dua kali.
name: Lonjakan harian

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 08:00 WIB - penutupan kemarin + berita semalam
    - cron: "0 8 * * 1-5"    # 15:00 WIB - sesi II masih berjalan, angka belum final
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Hanya cetak pesannya, jangan kirim"
        type: boolean
        default: true
      berita:
        description: "Sertakan berita semalam dan dampaknya (kiriman pagi)"
        type: boolean
        default: true

concurrency:
  group: wa-lonjakan
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt

      - name: Screening dan kirim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_TEMPLATE_LANG: ${{ vars.WA_TEMPLATE_LANG || 'id' }}
          WA_API_VERSION: ${{ vars.WA_API_VERSION || 'v25.0' }}
        run: |
          idxscreen notify \
            --preset lonjakan,volume-spike \
            --tp-sl \
            --top 15 \
            --max-stale-days 5 \
            --refresh \
            ${{ (github.event.schedule == '0 1 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.berita)) && '--news' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
