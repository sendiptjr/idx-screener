name: lonjakan-tenang
title: Lonjakan bervolume tenang
description: >
  Saham likuid yang melonjak >7% hari ini, belum terkunci ARA, masih di atas
  SMA20, dan naiknya TANPA lonjakan volume. Diukur pada 2 tahun data (Okt 2024 -
  Sep 2026, 845 emiten): kelompok ini menghasilkan +4,7% dalam 2 minggu melawan
  +0,7% pasar, dan unggul di 7 dari 8 kuartal.
note: >
  Horizon 1-2 minggu, bukan semalam - pada horizon 1 hari kelompok serupa
  tertinggal dari pasar setelah ongkos. Mediannya hanya 0,0%, jadi keunggulan
  datang dari sedikit pemenang besar: sebar ke 15-20 posisi, jangan pilih satu.
  Syarat volume rendah terasa berlawanan naluri tetapi konsisten di dua
  pengukuran terpisah; lonjakan bervolume besar justru tertinggal.
filters:
  - avg_value_20 > 1e10
  - change_pct > 7
  - not at_ara
  - volume_ratio < 2
  - close > sma20
sort: { by: change_pct, ascending: false }
limit: 20
columns: [ticker, name, sector, close, change_pct, volume_ratio, dist_ara, ret_1m, ret_3m, avg_value_20]
